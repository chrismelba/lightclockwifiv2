#
# Project Configuration File
#
# https://docs.platformio.org/en/latest/projectconf/index.html
#

[env:nodemcuv2]
platform = espressif8266 @ 4.2.1
framework = arduino
board = nodemcuv2
upload_port = thelightclock.local/update

# Generates h/assets.h (gzipped web assets) from web/ and h/tzdata.h
# (IANA zone -> POSIX TZ rules) from the core's TZ.h, before every build.
extra_scripts =
  pre:tools/build_assets.py
  pre:tools/build_tzdata.py

lib_deps =
  links2004/WebSockets @ ^2.6.1
  paulstoffregen/Time @ ^1.6

[platformio]
src_dir = .
